name: instabox-keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Renew activity lease
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_LEASE_TTL: "3600"
          INSTABOX_AUTO_RESUME: "1"
        run: |
          INSTABOX_ENV_FILE=/dev/null sh ./keepalive.sh --once
